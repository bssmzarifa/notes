<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Pocket Notes">
<meta name="theme-color" content="#1F5C58">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="manifest" href="manifest.json">
<style>:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0}[hidden]{display:none!important}</style>
<title>Pocket Notes</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Special+Elite&family=Archivo+Black&family=Caveat:wght@600&family=Cairo:wght@500;700;800&display=swap" rel="stylesheet">
<style>
/* Layout: green cutting mat as the ground, a cork board panel on top, paper index cards taped to the cork. One committed look, same in light and dark. */
:root{
  color-scheme:dark;
  --mat:#1F5C58; --mat-line:rgba(93,202,165,.22); --ink:#1b1b1a; --paper:#FBFAF6; --tab:#EDE8DC;
  --cork:#C69C6D; --cork-dot:rgba(138,95,52,.4); --cork-dot2:rgba(232,201,154,.4);
  --yellow:#F2E14C; --red:#E24B4A; --green:#3B6D11; --muted:#7c7a73; --cream:#F6F1E4; --rule:rgba(55,138,221,.35);
  --f-display:'Archivo Black','Arial Black',Impact,sans-serif;
  --f-type:'Special Elite','Courier New',Courier,monospace;
  --f-hand:'Caveat','Segoe Print','Bradley Hand',cursive;
  --f-ar:'Cairo','Geeza Pro','Noto Sans Arabic',Tahoma,sans-serif;
}
html,body{height:100%}
body{background-color:var(--mat);background-image:linear-gradient(var(--mat-line) 1px,transparent 1px),linear-gradient(90deg,var(--mat-line) 1px,transparent 1px);background-size:24px 24px;color:var(--ink);font-family:var(--f-type);-webkit-tap-highlight-color:transparent;overscroll-behavior:none}
body.ar{font-family:var(--f-ar)}
*{box-sizing:border-box}
button,input,textarea,select{font:inherit;color:inherit}
button{cursor:pointer;border:0;background:none}
:focus-visible{outline:3px solid var(--yellow);outline-offset:2px}
.wrap{max-width:560px;margin:0 auto;padding-left:max(14px,env(safe-area-inset-left,0px));padding-right:max(14px,env(safe-area-inset-right,0px))}
.star{flex:none}
/* lock */
#lock{min-height:100%;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:0;padding-block:24px}
.lcard{background:var(--paper);padding:16px 22px 14px;transform:rotate(-1.5deg);text-align:center;position:relative;min-width:210px;margin-top:12px}
.tape:before{content:"";position:absolute;top:-7px;left:50%;width:44px;height:14px;margin-left:-22px;background:rgba(241,239,232,.8);border:.5px solid #D3D1C7;transform:rotate(3deg)}
.lt1{font-family:var(--f-display);font-size:20px}
body.ar .lt1{font-family:var(--f-ar);font-weight:800}
.lt2{font-size:11px;color:var(--muted);letter-spacing:1.5px;margin-top:4px;min-height:15px}
.lt2.err{color:var(--red)}.lt2.ok{color:var(--green)}
.dots{display:flex;gap:18px;margin:26px 0 30px;direction:ltr}
.d{width:17px;height:17px;border-radius:50%;border:2px solid var(--cream);transition:all .15s}
.d.f{background:var(--yellow);border-color:var(--yellow);transform:scale(1.15)}
.dots.err .d{border-color:#F09595}.dots.err .d.f{background:var(--red);border-color:var(--red)}
.dots.ok .d{background:#97C459;border-color:#97C459}
@keyframes sh{0%,100%{transform:translateX(0)}20%,60%{transform:translateX(-10px)}40%,80%{transform:translateX(10px)}}
.shake{animation:sh .4s}
.pad{display:grid;grid-template-columns:repeat(3,74px);gap:14px 22px;direction:ltr}
.k{height:62px;background:var(--tab);font-family:var(--f-display);font-size:24px;display:flex;align-items:center;justify-content:center;border-radius:4px;transition:transform .08s,background .08s;touch-action:manipulation;user-select:none;-webkit-user-select:none}
.k:active,.k.pr{background:var(--yellow);transform:scale(.92)}
.k.ghost{background:transparent;color:var(--cream);font-size:22px}
.lfoot{display:flex;gap:18px;margin-top:26px}
.link{color:var(--cream);font-size:13px;text-decoration:underline;text-underline-offset:3px;padding:6px}
/* app */
#app{padding-bottom:calc(110px + env(safe-area-inset-bottom,0px))}
.hd{display:flex;align-items:center;gap:10px;padding-block:14px 8px}
.ttl{color:var(--cream);line-height:1;flex:1;min-width:0}
.ttl b{font-family:var(--f-display);font-size:24px;letter-spacing:1px;display:block;font-weight:400}
body.ar .ttl b{font-family:var(--f-ar);font-weight:800;letter-spacing:0}
.ttl span{font-size:10px;letter-spacing:2px}
.hbtn{background:var(--tab);color:var(--ink);height:38px;min-width:38px;padding:0 10px;border-radius:4px;font-size:13px;display:flex;align-items:center;justify-content:center;gap:6px}
.sr{display:flex;align-items:center;gap:8px;background:var(--paper);border-radius:3px;padding:0 10px;margin-bottom:10px}
.sr input{flex:1;min-width:0;border:0;background:transparent;height:42px;font-size:16px;outline:none}
.sr input::placeholder{color:var(--muted)}
.sr:focus-within{outline:3px solid var(--yellow)}
.tabs{display:flex;gap:5px;position:sticky;top:env(safe-area-inset-top,0px);z-index:5;padding-top:6px;background:var(--mat)}
.tab{flex:1;background:var(--tab);font-size:12px;padding:9px 6px 8px;display:flex;justify-content:space-between;align-items:baseline;gap:4px;border-radius:3px 3px 0 0;min-width:0}
.tab i{font-style:normal;font-size:10px;color:var(--muted);font-variant-numeric:tabular-nums}
.tab.on{background:var(--yellow)}
body.ar .tab{font-size:13px}
.cork{background-color:var(--cork);background-image:radial-gradient(var(--cork-dot) 1px,transparent 1.5px),radial-gradient(var(--cork-dot2) 1px,transparent 1.5px);background-size:7px 7px,11px 11px;background-position:0 0,3px 4px;border-radius:0 0 4px 4px;padding:14px 10px 18px;min-height:60vh}
.info{display:inline-block;background:var(--ink);color:var(--yellow);font-size:11px;letter-spacing:1px;padding:4px 9px;margin-bottom:12px}
.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px 11px;align-items:start}
.cd{background:var(--paper);padding:13px 10px 10px;position:relative;text-align:start;width:100%;min-height:86px;display:flex;flex-direction:column;gap:5px;transition:transform .2s}
.cd:active{transform:scale(.97)!important}
.cd.wide{grid-column:1/-1}
.cd.imp{box-shadow:inset 0 3px 0 var(--red)}
.lb{font-size:9px;color:var(--muted);letter-spacing:1px;display:flex;justify-content:space-between;gap:6px}
.lb u{text-decoration:none;color:var(--ink);font-size:9px;border:.5px solid #B4B2A9;padding:0 4px;white-space:nowrap}
.lb u.ex{background:var(--yellow);border-color:var(--yellow)}
.big{font-family:var(--f-display);font-size:16px;line-height:1.2;overflow-wrap:anywhere}
.hand{font-family:var(--f-hand);font-size:22px;line-height:1.1;overflow-wrap:anywhere;white-space:pre-wrap}
body.ar .big,body.ar .hand{font-family:var(--f-ar);font-weight:700;font-size:16px;line-height:1.5}
.idx{background-image:linear-gradient(transparent 21px,var(--rule) 21px);background-size:100% 22px;border-top:3px solid var(--red);padding-top:10px}
.row{display:flex;justify-content:space-between;gap:10px;font-family:var(--f-hand);font-size:21px;line-height:22px;font-variant-numeric:tabular-nums}
body.ar .row{font-family:var(--f-ar);font-size:15px;font-weight:500}
.tot{display:flex;justify-content:space-between;align-items:center;font-family:var(--f-display);font-size:15px;border-top:1.5px dashed var(--ink);padding-top:6px;margin-top:4px}
body.ar .tot{font-family:var(--f-ar);font-weight:800}
.tot span:last-child{background:var(--yellow);padding:1px 7px;font-variant-numeric:tabular-nums}
.num{font-family:var(--f-hand);font-size:22px;direction:ltr;unicode-bidi:isolate;user-select:all;-webkit-user-select:all}
.pact{display:flex;gap:6px;margin-top:4px}
.mini{font-size:11px;border:.5px solid #B4B2A9;padding:5px 8px;border-radius:3px;background:var(--tab);color:var(--ink);text-decoration:none;display:inline-flex;align-items:center}
mark{background:var(--yellow);color:inherit;padding:0 1px}
.empty{grid-column:1/-1;background:var(--paper);padding:22px 16px;text-align:center;transform:rotate(-1deg)}
.empty b{font-family:var(--f-display);font-size:18px;display:block;margin-bottom:6px;font-weight:400}
body.ar .empty b{font-family:var(--f-ar);font-weight:800}
.fab{position:fixed;right:calc(18px + env(safe-area-inset-right,0px));bottom:calc(20px + env(safe-area-inset-bottom,0px));width:64px;height:64px;border-radius:50%;background:var(--yellow);color:var(--ink);font-family:var(--f-display);font-size:34px;line-height:1;display:flex;align-items:center;justify-content:center;border:3px solid var(--ink);z-index:20}
body.ar .fab{right:auto;left:calc(18px + env(safe-area-inset-left,0px))}
/* sheets */
.ov{position:fixed;inset:0;background:rgba(10,20,18,.6);z-index:40;display:flex;align-items:flex-end;justify-content:center}
.sheet{background:var(--paper);width:100%;max-width:560px;max-height:92%;overflow-y:auto;border-radius:12px 12px 0 0;padding:18px max(16px,env(safe-area-inset-right,0px)) calc(18px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px));border-top:4px solid var(--red);display:flex;flex-direction:column;gap:12px}
.sheet h2{font-family:var(--f-display);font-size:20px;margin:0;font-weight:400}
body.ar .sheet h2{font-family:var(--f-ar);font-weight:800}
.seg{display:flex;gap:6px}
.seg button{flex:1;background:var(--tab);padding:10px 4px;border-radius:4px;font-size:13px}
.seg button.on{background:var(--yellow)}
.fld{display:flex;flex-direction:column;gap:5px;font-size:12px;color:var(--muted);letter-spacing:.5px}
.in{background:#fff;border:1.5px solid #D3D1C7;border-radius:4px;padding:10px;font-size:16px;color:var(--ink);width:100%;min-width:0}
.in:focus{outline:none;border-color:var(--ink)}
textarea.in{min-height:110px;resize:vertical;font-family:var(--f-hand);font-size:22px;line-height:1.2}
body.ar textarea.in{font-family:var(--f-ar);font-size:16px;line-height:1.6}
.chk{display:flex;align-items:center;gap:8px;font-size:14px;color:var(--ink)}
.chk input{width:20px;height:20px;accent-color:var(--red)}
.mrow{display:grid;grid-template-columns:minmax(0,1fr) 96px 36px;gap:6px}
.x{background:var(--tab);border-radius:4px;font-size:16px}
.live{display:flex;justify-content:space-between;font-family:var(--f-display);font-size:16px;padding:8px 10px;background:var(--yellow)}
body.ar .live{font-family:var(--f-ar);font-weight:800}
.acts{display:flex;gap:8px;flex-wrap:wrap}
.b{background:var(--tab);padding:12px 16px;border-radius:4px;font-size:14px;flex:1}
.b.pri{background:var(--ink);color:var(--yellow)}
.b.dng{background:transparent;color:var(--red);border:1.5px solid var(--red)}
.err{color:var(--red);font-size:13px;min-height:0}
.mi{display:flex;align-items:center;gap:10px;background:var(--tab);padding:13px 14px;border-radius:4px;font-size:15px;text-align:start;width:100%}
.mi.dng{color:var(--red)}
.hint{font-size:13px;color:var(--muted);line-height:1.5;margin:0}
.toast{position:fixed;left:50%;bottom:calc(100px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--yellow);padding:9px 16px;font-size:13px;letter-spacing:1px;z-index:50;border-radius:3px;white-space:nowrap}
.warn{background:var(--red);color:#fff;font-size:12px;padding:8px 10px;margin-bottom:10px;border-radius:3px}
.writer{position:fixed;left:0;right:0;top:0;height:100%;z-index:35;background:var(--paper);border-top:4px solid var(--red);display:flex;flex-direction:column;transform-origin:12% 95%;transform:scale(.06);opacity:0;transition:transform .34s cubic-bezier(.2,.8,.2,1),opacity .25s;padding-top:env(safe-area-inset-top,0px)}
body.ar .writer{transform-origin:12% 95%}
.writer.open{transform:none;opacity:1}
.wbar{display:flex;align-items:center;gap:10px;padding:10px max(14px,env(safe-area-inset-right,0px)) 6px max(14px,env(safe-area-inset-left,0px))}
.wback{color:#854F0B;font-size:16px;padding:8px 4px;font-weight:700}
.wicon{width:42px;height:42px;border-radius:50%;background:var(--tab);color:var(--red);display:flex;align-items:center;justify-content:center}
.wok{width:46px;height:46px;border-radius:50%;background:var(--yellow);color:var(--ink);display:flex;align-items:center;justify-content:center;border:2px solid var(--ink)}
.wpage{flex:1;overflow-y:auto;padding:8px max(18px,env(safe-area-inset-right,0px)) 18px max(18px,env(safe-area-inset-left,0px));font-family:var(--f-type);font-size:18px;line-height:1.6;outline:none;white-space:pre-wrap;overflow-wrap:anywhere;-webkit-user-select:text;user-select:text;position:relative}
body.ar .wpage{font-family:var(--f-ar);font-size:18px;line-height:1.8}
.wpage::first-line{font-family:var(--f-display);font-size:24px}
body.ar .wpage::first-line{font-family:var(--f-ar);font-weight:800;font-size:24px}
.wpage.empty:before{content:attr(data-ph);color:#a9a69c;position:absolute;pointer-events:none;white-space:pre-wrap;font-size:16px;line-height:1.6}
.wlive{display:flex;justify-content:space-between;gap:10px;background:var(--yellow);color:#412402;font-family:var(--f-display);font-size:15px;padding:9px max(16px,env(safe-area-inset-right,0px)) calc(9px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px))}
body.ar .wlive{font-family:var(--f-ar);font-weight:800}
.big.mt{font-size:20px;margin:2px 0 6px}
body.ar .big.mt{font-size:21px;font-weight:800}
.num{font-family:var(--f-display)!important;font-size:18px!important;letter-spacing:.5px}
.mini.call{background:#3B6D11;border-color:#3B6D11;color:#fff;gap:5px;font-weight:700}
.ttl b{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.studio{position:fixed;inset:0;z-index:36;background:#1b1b1a;color:var(--cream);overflow-y:auto;-webkit-overflow-scrolling:touch;padding:env(safe-area-inset-top,0px) max(16px,env(safe-area-inset-right,0px)) calc(24px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px));display:flex;flex-direction:column;gap:14px;opacity:0;transform:translateY(24px);transition:opacity .25s,transform .3s}
.studio.open{opacity:1;transform:none}
.studio>*{flex:none}
.sbar{display:flex;align-items:center;gap:10px;padding-top:12px}
.sbar h2{flex:1;margin:0;font-family:var(--f-display);font-size:20px;font-weight:400}
body.ar .sbar h2{font-family:var(--f-ar);font-weight:800}
.sbar .wback{color:var(--yellow)}
.wframe{width:min(62vw,240px);aspect-ratio:1125/2436;max-width:100%;margin:0 auto;border:6px solid #444441;border-radius:28px;overflow:hidden;position:relative;background:#000}
.wframe canvas{width:100%;height:100%;display:block}
.wclock{position:absolute;left:0;right:0;top:9%;text-align:center;color:#fff;font-family:-apple-system,'Helvetica Neue',Arial,sans-serif;direction:ltr;pointer-events:none;text-shadow:0 1px 4px rgba(0,0,0,.35)}
.wclock small{display:block;font-size:11px;font-weight:600}
.wclock b{display:block;font-size:46px;font-weight:600;line-height:1}
.slab{font-size:11px;letter-spacing:1.5px;color:#B4B2A9;display:flex;justify-content:space-between}
body.ar .slab{letter-spacing:0;font-size:13px}
.chips{display:flex;flex-wrap:wrap;gap:7px}
.chip{background:#2C2C2A;color:var(--cream);border:1.5px solid #444441;border-radius:20px;padding:7px 12px;font-size:13px;max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;display:flex;align-items:center;gap:6px}
.chip.on{background:var(--yellow);color:var(--ink);border-color:var(--yellow)}
.chip i{font-style:normal;font-weight:700}
.sws{display:flex;gap:8px}
.sw{flex:1;height:52px;border-radius:8px;border:3px solid transparent;font-size:11px;color:#fff;display:flex;align-items:flex-end;justify-content:center;padding-bottom:3px;text-shadow:0 1px 2px rgba(0,0,0,.6)}
.sw.on{border-color:var(--yellow)}
.stks{display:flex;gap:8px;flex-wrap:wrap}
.stk{width:46px;height:46px;border-radius:10px;background:#2C2C2A;font-size:24px;display:flex;align-items:center;justify-content:center;font-family:'Apple Color Emoji','Segoe UI Emoji','Noto Color Emoji',sans-serif}
.stk:active{transform:scale(.88)}
.stk.txt{width:auto;padding:0 12px;font-size:13px;font-family:inherit;color:var(--cream)}
.wsave{background:var(--yellow);color:var(--ink);font-family:var(--f-display);font-size:17px;padding:15px;border-radius:8px;border:2px solid var(--ink)}
body.ar .wsave{font-family:var(--f-ar);font-weight:800}
.whow{font-size:13px;line-height:1.6;color:#D3D1C7;background:#2C2C2A;border-radius:8px;padding:10px 12px;margin:0}
.whow b{color:var(--yellow);font-weight:700}
.wnote{font-size:12px;color:#F09595;min-height:0;margin:0}
.wimg{max-height:58vh;max-width:100%;margin:0 auto;display:block;border-radius:12px;border:1px solid #D3D1C7;-webkit-touch-callout:default}
.hand.sm{font-size:19px;color:#444441}
body.ar .hand.sm{font-size:14px;font-weight:500}
@keyframes pop{0%{outline:3px solid var(--yellow);transform:scale(1.08)}100%{outline:3px solid transparent}}
.cd.fresh{animation:pop 1.2s ease-out}

/* v5: kind chooser, photos, status pin, reminder */
.wbar{gap:8px}
.wkinds{flex:1;display:flex;justify-content:center;gap:10px;min-width:0}
.wkind{display:flex;align-items:center;gap:5px;font-size:12px;color:#8A7A4A;padding:9px 2px;white-space:nowrap}
.wkind i{width:15px;height:15px;border-radius:4px;border:1.5px solid #A8975A;display:flex;align-items:center;justify-content:center;flex:none;color:var(--yellow)}
.wkind i svg{opacity:0}
.wkind.on{color:var(--ink);font-weight:700}
.wkind.on i{background:var(--ink);border-color:var(--ink)}
.wkind.on i svg{opacity:1}
.wrnd{width:38px;height:38px;border-radius:50%;border:1.5px solid #854F0B;color:#854F0B;background:#fff;display:flex;align-items:center;justify-content:center;flex:none}
.wrnd.on{background:#E6F1FB;border-color:#185FA5;color:#0C447C}
.wrnd.del{border-color:#D3D1C7;color:var(--red)}
.wtools{display:flex;align-items:center;gap:10px;padding:6px max(14px,env(safe-area-inset-right,0px)) 8px max(14px,env(safe-area-inset-left,0px))}
.wrem{font-size:12px;color:#0C447C;background:#E6F1FB;border-radius:20px;padding:5px 10px;display:inline-flex;gap:5px;align-items:center;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.wpage,body.ar .wpage{font-size:16px}
.wpage:not(.raw)>div:first-child:not(.wph){font-family:var(--f-display);font-size:24px;line-height:1.5}
body.ar .wpage:not(.raw)>div:first-child:not(.wph){font-family:var(--f-ar);font-weight:800;font-size:24px}
.wph{position:relative;margin:12px 0 10px;background:#fff;border:1px solid #D3D1C7;padding:6px;transform:rotate(-1deg);max-width:340px;-webkit-user-select:none;user-select:none}
.wph img{display:block;width:100%;max-height:46vh;object-fit:cover}
.wph button{position:absolute;top:-11px;inset-inline-end:-11px;width:30px;height:30px;border-radius:50%;background:var(--ink);color:#fff;font-size:14px;display:flex;align-items:center;justify-content:center}
.wph:before{content:"";position:absolute;top:-9px;left:50%;width:56px;height:16px;margin-left:-28px;background:rgba(242,225,76,.85)}
.pin{position:absolute;top:-15px;inset-inline-start:8px;width:26px;height:26px;border-radius:50%;display:flex;align-items:center;justify-content:center;z-index:2;padding:0;transition:transform .15s}
.pin:after{content:"";position:absolute;inset:-9px}
.pin:active{transform:scale(1.3)}
.pin svg{display:none}
.pin.n{background:rgba(251,250,246,.55);border:1.5px dashed #7a5a30}
.pin.todo{background:#639922;border:2px solid var(--paper)}
.pin.todo:before{content:"";width:8px;height:8px;border-radius:50%;background:#EAF3DE}
.pin.done{background:var(--red);border:2px solid var(--paper);color:#fff}
.pin.done svg{display:block}
.cd.isdone .big{color:#888780;text-decoration:line-through}
.stt{font-size:10px;font-weight:700}

/* ---------- PIN ---------- */
async function hash(p){const salt=S.get('salt','');const s=salt+':'+p;try{const b=await crypto.subtle.digest('SHA-256',new TextEncoder().encode(s));return [...new Uint8Array(b)].map(x=>x.toString(16).padStart(2,'0')).join('')}catch(e){let h=5381;for(const c of s)h=((h<<5)+h+c.charCodeAt(0))|0;return 'f'+h}}
let mode='enter',pin='',first='',busy=false,fails=S.get('fails',0),until=S.get('until',0);
const pad=$('#pad');
pad.innerHTML=['1','2','3','4','5','6','7','8','9','','0','⌫'].map(k=>k===''?'<div></div>':`<button class="k ${k==='⌫'?'ghost':''}" data-k="${k}" aria-label="${k==='⌫'?'Delete':k}">${k}</button>`).join('');
function paint(){[...$('#dots').children].forEach((d,i)=>d.className='d'+(i<pin.length?' f':''))}
function sub(txt,cls){const e=$('#lt2');e.textContent=txt;e.className='lt2'+(cls?' '+cls:'')}
function lockText(){const m={create:['createPin','createSub'],confirm:['confirmPin','confirmSub'],enter:['enterPin','enterSub'],verify:['currentPin','currentSub']}[mode];$('#lt1').textContent=t(m[0]);sub(t(m[1]));$('#forgotBtn').hidden=!(mode==='enter');$('#cancelPin').hidden=!(changing);}
let changing=false;
function showLock(m){FL.forEach(f=>{try{f()}catch(e){}});FL.clear();document.querySelectorAll('.writer,.studio,.cmov,.selbar,.tkp').forEach(e=>{if(!e.classList.contains('acct')||au)e.remove()});selMode=false;selSet.clear();$('#fab').hidden=false;mode=m;pin='';paint();$('#dots').className='dots';$('#app').hidden=true;$('#lock').hidden=false;$('#ov').hidden=true;lockText();}
function bad(msg){busy=true;const d=$('#dots');d.className='dots err shake';sub(msg,'err');setTimeout(()=>{d.className='dots';pin='';paint();busy=false},650)}
async function done(){
 if(mode==='create'){first=pin;mode='confirm';pin='';paint();lockText();return}
 if(mode==='confirm'){if(pin!==first){mode='create';bad(t('mismatch'));setTimeout(lockText,700);return}
  if(!S.get('salt',''))S.set('salt',Math.random().toString(36).slice(2)+Date.now());
  S.set('pin',await hash(pin));const wasChanging=changing;changing=false;if(items===null){items=examples();save()}openApp(wasChanging?t('pinChanged'):'');return}
 const now=Date.now();if(until>now){bad(t('wait',{s:Math.ceil((until-now)/1000)}));return}
 const ok=(await hash(pin))===S.get('pin','');
 if(ok){fails=0;S.set('fails',0);if(mode==='verify'){mode='create';pin='';paint();lockText();return}
  busy=true;$('#dots').className='dots ok';sub(t('welcome'),'ok');setTimeout(()=>{busy=false;openApp()},260)}
 else{fails++;S.set('fails',fails);if(fails>=5){until=Date.now()+30000;S.set('until',until);fails=0;S.set('fails',0)}bad(until>Date.now()?t('wait',{s:30}):t('wrong'))}
}
function press(k){if(busy)return;if(k==='⌫'){pin=pin.slice(0,-1);paint();return}if(pin.length>=4)return;pin+=k;paint();if(pin.length===4)setTimeout(done,140)}
pad.addEventListener('click',e=>{const b=e.target.closest('.k');if(b)press(b.dataset.k)});
document.addEventListener('keydown',e=>{if($('#lock').hidden)return;if(/^[0-9]$/.test(e.key))press(e.key);else if(e.key==='Backspace')press('⌫')});
$('#forgotBtn').onclick=()=>confirmSheet(t('forgot'),t('forgotSure'),t('eraseBtn'),eraseAll);
$('#cancelPin').onclick=()=>{changing=false;openApp()};

function tkStats(days){const tot={},dishes={},dishDays={},camps={},rates=[0,0,0];let pots=0;
 days.forEach(d=>{pots+=d.pots||0;if(d.rate>0&&d.rate<4)rates[d.rate-1]++;const sd={};
  tkParts(d).forEach(p=>{if(p.dish){dishes[p.dish]=(dishes[p.dish]||0)+(p.pots||0);if(!sd[p.dish]){sd[p.dish]=1;dishDays[p.dish]=(dishDays[p.dish]||0)+1}}(p.ings||[]).forEach(i=>{if(i.q>0){const k=i.n+'|'+i.u;tot[k]=(tot[k]||0)+i.q*(p.pots||0)}})});
  const ps=d.places||[];ps.forEach(x=>{const p=dayCampPots(x.n,d);if(!camps[x.n])camps[x.n]={pots:0,visits:0};camps[x.n].pots+=p;camps[x.n].visits++})});
 return{days:days.length,pots,
  tot:Object.keys(tot).map(k=>({n:k.split('|')[0],u:k.split('|')[1],v:tot[k]})),
  dishes:Object.keys(dishes).map(n=>({n,v:dishes[n]})).sort((a,b)=>b.v-a.v),
  dishDays:Object.keys(dishDays).map(n=>({n,v:dishDays[n]})).sort((a,b)=>b.v-a.v),
  camps:Object.keys(camps).map(n=>({n,pots:camps[n].pots,visits:camps[n].visits})).sort((a,b)=>b.pots-a.pots),
  rates}}

function shareBoth(txt,canvasFn,name){if(!txt)return;
 const s=sheet(`<h2>${t('share')}</h2><button class="b wa" id="sbT">${t('tkShareText')}</button><button class="b" id="sbI">${t('tkSharePic')}</button><button class="b" id="iClose">${t('close')}</button>`);

 s.querySelector('#sbI').onclick=async()=>{closeSheet();try{if(document.fonts&&document.fonts.load){const fl=Promise.all(['800 46px Cairo','700 30px Cairo','500 28px Cairo'].map(f=>document.fonts.load(f).catch(()=>{})));await Promise.race([fl,new Promise(r=>setTimeout(r,1500))])}}catch(e){}let cv;try{cv=canvasFn()}catch(e){cv=null}if(cv)shareCanvas(cv,name||t('share'),'takiya-report');else toast(t('tkEmptyT'))}}
function drawReport(title,sub,stats,sections){const W=1080,P=60,A=lang==='ar';
 let H=P+64;if(sub)H+=40;H+=16;if(stats&&stats.length)H+=150;
 sections.forEach(s=>{H+=92;s.rows.forEach(r=>{H+=r.bar?72:50})});H+=P;
 const cv=document.createElement('canvas');cv.width=W;cv.height=H;const c=cv.getContext('2d');
 c.fillStyle='#F1EFE8';c.fillRect(0,0,W,H);
 const sx=A?W-P:P,ex=A?P:W-P,align=A?'right':'left';try{c.direction=A?'rtl':'ltr'}catch(e){}
 const clip=(fn,x,w)=>{c.save();c.beginPath();c.rect(A?x-w:x,0,w,H);c.clip();fn();c.restore()};
 c.textAlign=align;c.textBaseline='alphabetic';let y=P+52;
 c.fillStyle='#0C447C';c.font='800 46px Cairo,sans-serif';c.fillText(title,sx,y);y+=sub?42:16;
 if(sub){c.fillStyle='#6b6a64';c.font='500 26px Cairo,sans-serif';c.fillText(sub,sx,y);y+=30}
 y+=14;
 if(stats&&stats.length){const n=stats.length,g=18,bw=(W-P*2-g*(n-1))/n;let bx=P;
  stats.forEach(st=>{c.fillStyle='#E6F1FB';rr(c,bx,y,bw,120,16);c.fill();c.textAlign='center';
   c.fillStyle='#0C447C';c.font='800 46px Cairo,sans-serif';c.fillText(String(st.v),bx+bw/2,y+66);
   c.fillStyle='#185FA5';c.font='500 24px Cairo,sans-serif';c.fillText(st.label,bx+bw/2,y+98);bx+=bw+g});
  c.textAlign=align;y+=150}
 sections.forEach(s=>{y+=44;c.fillStyle='#0C447C';c.font='700 30px Cairo,sans-serif';c.fillText(s.head,sx,y);y+=50;
  s.rows.forEach(r=>{
   if(r.bar){const f=Math.max(.05,Math.min(1,r.bar.frac||0)),barW=(W-P*2)*f;
    c.fillStyle='#C0DD97';rr(c,A?W-P-barW:P,y,barW,20,10);c.fill();
    c.fillStyle='#2C2C2A';c.font='500 25px Cairo,sans-serif';clip(()=>c.fillText(r.bar.label+' · '+r.bar.v,sx,y+48),sx,W-P*2);y+=72}
   else{c.fillStyle='#2C2C2A';c.font='500 27px Cairo,sans-serif';c.textAlign=align;clip(()=>c.fillText(r.k,sx,y+26),sx,W-P*2-240);
    c.textAlign=A?'left':'right';c.fillText(String(r.v),ex,y+26);c.textAlign=align;y+=50}})});
 return cv}

function rosterImport(c,onDone){const A=lang==='ar';let inp=document.getElementById('rosterFile');
 if(!inp){inp=document.createElement('input');inp.type='file';inp.id='rosterFile';inp.hidden=true;inp.accept='.xlsx,.xls,.csv';document.body.appendChild(inp)}
 inp.value='';inp.onchange=async()=>{const file=inp.files&&inp.files[0];inp.value='';if(!file)return;toast(t('xLoading'));let X;try{X=await loadXLSX()}catch(e){toast(t('xLibFail'));return}
  let rows;try{const buf=await file.arrayBuffer();const wb=X.read(new Uint8Array(buf),{type:'array'});const ws=wb.Sheets[wb.SheetNames[0]];rows=X.utils.sheet_to_json(ws,{header:1,defval:''})}catch(e){toast(t('xBad'));return}
  rows=(rows||[]).filter(r=>r&&r.some(v=>String(v).trim()!==''));if(!rows.length){toast(t('xNothing'));return}
  const norm=s=>String(s==null?'':s).trim();
  const hdr=rows[0].map(norm),hasHdr=hdr.some(h=>/اسم|name|جوال|جوّال|هاتف|phone|عدد|افراد|أفراد/i.test(h));
  let nameC=0,phoneC=-1,memC=-1;
  if(hasHdr){hdr.forEach((h,i)=>{if(nameC===0&&/اسم|name/i.test(h))nameC=i;if(phoneC<0&&/جوال|جوّال|هاتف|phone|موبايل|mobile|رقم/i.test(h))phoneC=i;if(memC<0&&/عدد|افراد|أفراد|members|count|حجم/i.test(h))memC=i})}
  const body=hasHdr?rows.slice(1):rows;
  if(!hasHdr){const cols=Math.max.apply(null,body.map(r=>r.length));for(let i=0;i<cols;i++){const vals=body.map(r=>fixDigits(norm(r[i]))).filter(Boolean);if(!vals.length)continue;const ph=vals.filter(v=>/^[+\d][\d\s\-]{6,}$/.test(v)).length,si=vals.filter(v=>/^\d{1,3}$/.test(v)).length;if(phoneC<0&&i!==nameC&&ph>vals.length*0.5)phoneC=i;else if(memC<0&&i!==nameC&&i!==phoneC&&si>vals.length*0.5)memC=i}}
  let added=0;const seen=new Set((c.roster||[]).map(x=>(x.name||'')+'|'+(x.phone||'')));
  body.forEach(r=>{const nm=norm(r[nameC]);if(!nm||/^(اسم|الاسم|name)$/i.test(nm))return;const ph=phoneC>=0?norm(r[phoneC]):'';const mmRaw=memC>=0?fixDigits(norm(r[memC])):'';const mm=/^\d{1,4}$/.test(mmRaw)?parseInt(mmRaw,10):'';const key=nm+'|'+ph;if(seen.has(key))return;seen.add(key);c.roster.push({id:newFid(added),name:nm,m:mm,phone:ph});added++});
  tkSave();onDone&&onDone();toast(added?(A?('استوردنا '+added+' عائلة'):('Imported '+added+' families')):(A?'ما في أسماء جديدة لإضافتها.':'No new names to add.'))};
 inp.click()}

function cmMemRow(m){const A=lang==='ar',age=cmAge(m);const fl=(k,lab)=>`<button type="button" class="mfl${m[k]?' on':''}" data-mf="${k}" data-mid="${m.id}">${lab}</button>`;
 return `<div class="memr" data-mid="${m.id}"><div class="memn"><b>${esc(m.name||'—')}</b><span>${A?cmNA(age)+' سنة · '+(m.sex==='f'?'أنثى':'ذكر'):age+'y · '+(m.sex==='f'?'F':'M')}</span></div><div class="memf">${fl('dis',A?'إعاقة':'Dis')}${fl('chr',A?'مزمن':'Chronic')}${m.sex==='f'?fl('preg',A?'حامل/مرضع':'Preg'):''}${fl('orph',A?'يتيم':'Orphan')}</div><button type="button" class="memx" data-mdel="${m.id}">×</button></div>`}

/* flattened individuals for by-name lists/exports, honoring the active filter + search */
function cmIndividuals(){const F=cmFF;let fams=cmL('fam');
 if(F==='widow')fams=fams.filter(x=>/أرمل|ارمل|أرامل/.test(String(x.stat||'')));
 else if(F==='dis')fams=fams.filter(x=>cmNum(x.dis)>0||(x.mem||[]).some(m=>m.dis));
 else if(F==='u5')fams=fams.filter(x=>(x.mem||[]).some(m=>cmAge(m)<5)||cmNum(x.u5)>0);
 else if(F==='old')fams=fams.filter(x=>(x.mem||[]).some(m=>cmAge(m)>=60)||cmNum(x.old)>0);
 else if(F==='preg')fams=fams.filter(x=>(x.mem||[]).some(m=>m.preg)||cmNum(x.preg)>0);
 else if(F==='noid')fams=fams.filter(x=>!String(x.hid||'').trim());
 const q=norm((cmFQ||'').trim());let out=[];
 fams.forEach(f=>(f.mem||[]).forEach(m=>out.push({m,f})));
 if(F==='u5')out=out.filter(o=>cmAge(o.m)<5);else if(F==='old')out=out.filter(o=>cmAge(o.m)>=60);
 else if(F==='dis')out=out.filter(o=>o.m.dis);else if(F==='preg')out=out.filter(o=>o.m.preg);
 if(q)out=out.filter(o=>norm([o.m.name,o.f.head,o.f.hid,o.f.tent].join(' ')).includes(q));
 out.sort((a,b)=>String(a.m.name||'').localeCompare(String(b.m.name||''),'ar'));return out}
function cmMemGaps(){const F=cmFF;let fams=cmL('fam');
 if(F==='dis')fams=fams.filter(x=>cmNum(x.dis)>0);else if(F==='u5')fams=fams.filter(x=>cmNum(x.u5)>0);
 else if(F==='old')fams=fams.filter(x=>cmNum(x.old)>0);else if(F==='preg')fams=fams.filter(x=>cmNum(x.preg)>0);
 else if(F==='widow')fams=fams.filter(x=>/أرمل|ارمل|أرامل/.test(String(x.stat||'')));
 return fams.filter(x=>!(x.mem&&x.mem.length)).length}
async function cmExportMem(){toast(t('xLoading'));let XL;try{XL=await loadXLSX()}catch(e){toast(t('xLibFail'));return}

 const aoa=[head,cols];

 const title=ex?esc(f.head||f.wife||''):X('عيلة جديدة','New family');
 const w=document.createElement('div');w.className='tkp';
 w.innerHTML=`<div class="tkbar"><button class="sbt" id="iClose">${ro?t('close'):t('cancel')}</button><b style="flex:1;text-align:center;font-size:15px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;padding:0 6px">${title}</b>${ro?'<span style="width:56px"></span>':`<button class="sbt" id="fOk" style="font-weight:700">${t('save')}</button>`}</div><div class="tkb" id="cmfamb">${ex&&f.phone?`<div class="pact" style="gap:8px;margin-bottom:10px">${cmTel(f.phone)}</div>`:''}
  ${cmF('fH',FL.head,f.head)}${n2(cmF('fI',FL.hid,f.hid,{num:1,dir:'ltr'}),cmF('fS',FL.stat,f.stat))}${n2(cmF('fW',FL.wife,f.wife),cmF('fI2',FL.hid2,f.hid2,{dir:'ltr'}))}
  ${n2(cmF('fZ',FL.size,f.size,{num:1}),cmF('fT',FL.tent,f.tent))}${n2(cmF('fP',FL.phone,f.phone,{num:1,dir:'ltr',type:'tel'}),cmF('fO',FL.origin,f.origin))}${n2(cmF('fHo',FL.housing,f.housing),cmF('fPl',FL.place,f.place))}
  <div class="rphead" style="margin:4px 0 0">${X('الحالات الخاصة (عدد)','Vulnerable (count)')}</div>${n2(cmF('fU',FL.u5,f.u5,{num:1}),cmF('fOl',FL.old,f.old,{num:1}))}${n2(cmF('fPr',FL.preg,f.preg,{num:1}),cmF('fD',FL.dis,f.dis,{num:1}))}
  ${cmMemSection(f)}<label class="fld">${FL.notes}<textarea class="in cmin" id="fN" dir="auto" rows="2">${esc(f.notes||'')}</textarea></label>
  ${ex&&!ro?`<button class="b dng" id="fDel" style="width:100%;margin-top:16px">${t('del')}</button>`:''}</div>`;
 const y0=window.pageYOffset||document.documentElement.scrollTop||0;
 document.body.appendChild(w);const fit=panelFit(w),s=w.querySelector('#cmfamb');
 function close(){window.visualViewport&&visualViewport.removeEventListener('resize',fit);window.scrollTo(0,y0);w.classList.remove('open');setTimeout(()=>{w.remove();window.scrollTo(0,y0);if(window.__famRefresh)window.__famRefresh()},350)}
 if(ro){s.querySelectorAll('input,textarea').forEach(e=>e.readOnly=true);const _ma=w.querySelector('.memadd');if(_ma)_ma.style.display='none';w.querySelector('#iClose').onclick=close;requestAnimationFrame(()=>w.classList.add('open'));return}
 w.querySelector('#iClose').onclick=close;
 cmMemWire(w,f);w.querySelector('#fOk').onclick=()=>{const g=k=>cmV(s,k);f.head=g('fH');f.hid=cmId(g('fI'));f.stat=g('fS');f.wife=g('fW');f.hid2=cmId(g('fI2'));f.size=String(cmNum(g('fZ'))||'');f.tent=g('fT');f.phone=cmPhone(g('fP'));f.origin=g('fO');f.housing=g('fHo');f.place=g('fPl');['u5','old','preg','dis'].forEach((k,i)=>f[k]=String(cmNum(g(['fU','fOl','fPr','fD'][i]))||''));f.notes=s.querySelector('#fN').value.trim();cmMemDerive(f);
  if(!f.head&&!f.wife){s.querySelector('#fH').focus();return}if(f.hid&&cmL('fam').some(x=>x.hid===f.hid&&x.id!==f.id)){toast(X('رقم الهوية هذا موجود لعيلة ثانية','This ID belongs to another family'));return}cmPut('fam',f);render();close();toast(t('saved'))};
 const dl=w.querySelector('#fDel');if(dl)dl.onclick=()=>confirmSheet(t('del'),X('حذف هذه العيلة من الكشف؟','Delete this family?'),t('yesDel'),()=>{cmDel('fam',f.id);render();close()});
 requestAnimationFrame(()=>w.classList.add('open'))}
function cmCom(id,role){const ex=id?camp.com.find(x=>x.id===id):null,m=ex?clone(ex):{id:uid(),role:role||''},ro=!cmCan();
 const s=sheet(`<h2>${ex?esc(m.name):X('عضو لجنة','Committee member')}</h2>${cmF('mN',X('الاسم','Name'),m.name)}<label class="fld">${X('الدور','Role')}<input class="in cmin" id="mR" list="cmRoles" dir="auto" value="${esc(m.role||'')}"><datalist id="cmRoles">${CM_ROLES.map(r=>`<option value="${esc(r)}">`).join('')}</datalist></label>${cmF('mP',X('الجوال','Phone'),m.phone,{num:1,dir:'ltr',type:'tel'})}
  ${ro?`<button class="b" id="iClose">${t('close')}</button>`:`<div class="acts"><button class="b" id="iClose">${t('cancel')}</button><button class="b pri" id="mOk">${t('save')}</button></div>${ex?`<button class="b dng" id="mDel">${t('del')}</button>`:''}`}`);
 if(ro)s.querySelectorAll('input').forEach(e=>e.readOnly=true);s.querySelector('#iClose').onclick=closeSheet;if(ro)return;
 s.querySelector('#mOk').onclick=()=>{m.name=cmV(s,'mN');m.role=cmV(s,'mR');m.phone=cmPhone(cmV(s,'mP'));if(!m.name){s.querySelector('#mN').focus();return}cmPut('com',m);closeSheet();render();toast(t('saved'))};
 const dl=s.querySelector('#mDel');if(dl)dl.onclick=()=>{cmDel('com',m.id);closeSheet();render()}}
function cmMeet(id){const ex=id?camp.meet.find(x=>x.id===id):null,m=ex?clone(ex):{id:uid(),date:ymd(new Date()),text:''},ro=!cmCan();
 const s=sheet(`<h2>${X('اجتماع اللجنة','Committee meeting')}</h2>${cmF('eD',X('التاريخ','Date'),m.date,{type:'date'})}<label class="fld">${X('شو قررتوا ومين مسؤول عن شو','Decisions and who does what')}<textarea class="in cmin" id="eT" dir="auto" rows="7" placeholder="${X('١. جبريل يتابع مع منظمة المي\n٢. …','1. …')}">${esc(m.text||'')}</textarea></label>
  ${ro?`<button class="b" id="iClose">${t('close')}</button>`:`<div class="acts"><button class="b" id="iClose">${t('cancel')}</button><button class="b pri" id="eOk">${t('save')}</button></div>`}${ex?`<button class="b wa" id="eSh">${t('share')}</button>`:''}${ex&&!ro?`<button class="b dng" id="eDel">${t('del')}</button>`:''}`);
 if(ro)s.querySelectorAll('input,textarea').forEach(e=>e.readOnly=true);s.querySelector('#iClose').onclick=closeSheet;
 const sh=s.querySelector('#eSh');if(sh)sh.onclick=()=>{closeSheet();shareRaw(X('اجتماع لجنة ','Meeting · ')+camp.info.name+' · '+tkDate(m.date,lang==='ar'?'ar':'en')+'\n\n'+m.text)};if(ro)return;
 s.querySelector('#eOk').onclick=()=>{m.date=cmV(s,'eD')||ymd(new Date());m.text=s.querySelector('#eT').value.trim();if(!m.text){s.querySelector('#eT').focus();return}cmPut('meet',m);closeSheet();render();toast(t('saved'))};
 const dl=s.querySelector('#eDel');if(dl)dl.onclick=()=>{cmDel('meet',m.id);closeSheet();render()}}
function cmOrg(id){const ex=id?camp.org.find(x=>x.id===id):null,o=ex?clone(ex):{id:uid(),days:[]},ro=!cmCan(),W=WD();if(!Array.isArray(o.days))o.days=[];
 const s=sheet(`<h2>${ex?esc(o.name):X('منظمة جديدة','New organization')}</h2>${ex&&o.phone?`<div class="pact" style="gap:8px">${cmTel(o.phone)}</div>`:''}${cmF('oN',X('اسم المنظمة أو الجمعية','Name'),o.name)}${cmF('oS',X('شو بتقدّم','Service'),o.service,{ph:X('مي، طرود، تكية، نظافة…','Water, food parcels…')})}
  <div class="fld">${X('أيام الزيارة','Visit days')}<div class="cmdays">${W.map((d,i)=>`<button class="tkpchip ${o.days.indexOf(i)>-1?'on':''}" data-d="${i}">${d}</button>`).join('')}</div></div>
  <div class="cm2">${cmF('oC',X('اسم المسؤول','Contact'),o.contact)}${cmF('oP',X('جواله','Phone'),o.phone,{num:1,dir:'ltr',type:'tel'})}</div>${cmF('oL',X('آخر زيارة','Last visit'),o.last,{type:'date'})}
  <label class="fld">${X('ملاحظات','Notes')}<textarea class="in cmin" id="oNo" dir="auto" rows="2">${esc(o.notes||'')}</textarea></label>
  ${ro?`<button class="b" id="iClose">${t('close')}</button>`:`<button class="b" id="oToday">${X('زارتنا اليوم','Visited today')}</button><div class="acts"><button class="b" id="iClose">${t('cancel')}</button><button class="b pri" id="oOk">${t('save')}</button></div>${ex?`<button class="b dng" id="oDel">${t('del')}</button>`:''}`}`);
 if(ro)s.querySelectorAll('input,textarea').forEach(e=>e.readOnly=true);s.querySelector('#iClose').onclick=closeSheet;if(ro)return;
 s.querySelectorAll('[data-d]').forEach(b=>b.onclick=()=>{const d=+b.dataset.d,i=o.days.indexOf(d);if(i>-1)o.days.splice(i,1);else o.days.push(d);b.classList.toggle('on')});
 s.querySelector('#oToday').onclick=()=>{s.querySelector('#oL').value=ymd(new Date())};
 s.querySelector('#oOk').onclick=()=>{o.name=cmV(s,'oN');o.service=cmV(s,'oS');o.contact=cmV(s,'oC');o.phone=cmPhone(cmV(s,'oP'));o.last=cmV(s,'oL');o.notes=s.querySelector('#oNo').value.trim();o.days.sort();if(!o.name){s.querySelector('#oN').focus();return}cmPut('org',o);closeSheet();render();toast(t('saved'))};
 const dl=s.querySelector('#oDel');if(dl)dl.onclick=()=>confirmSheet(t('del'),X('حذف المنظمة؟','Delete organization?'),t('yesDel'),()=>{cmDel('org',o.id);render()})}
function cmDist(id){const ex=id?camp.dist.find(x=>x.id===id):null,d=ex?clone(ex):{id:uid(),date:ymd(new Date()),got:[]},orgs=cmL('org');
 const s=sheet(`<h2>${ex?X('تعديل التوزيع','Edit distribution'):X('توزيع جديد','New distribution')}</h2>${cmF('dW',X('شو انوزّع','What'),d.what,{ph:X('طرود غذائية، بطانيات، فرشات…','Food parcels, blankets…')})}<label class="fld">${X('من أي منظمة','From')}<input class="in cmin" id="dO" list="cmOrgs" dir="auto" value="${esc(d.org||'')}"><datalist id="cmOrgs">${orgs.map(o=>`<option value="${esc(o.name)}">`).join('')}</datalist></label>${cmF('dD',X('التاريخ','Date'),d.date,{type:'date'})}
  <div class="acts"><button class="b" id="iClose">${t('cancel')}</button><button class="b pri" id="dOk">${ex?t('save'):X('ابدأ التأشير','Start ticking')}</button></div>${ex?`<button class="b dng" id="dDel">${t('del')}</button>`:''}`);
 s.querySelector('#iClose').onclick=closeSheet;
 s.querySelector('#dOk').onclick=()=>{d.what=cmV(s,'dW');d.org=cmV(s,'dO');d.date=cmV(s,'dD')||ymd(new Date());if(!d.what){s.querySelector('#dW').focus();return}cmPut('dist',d);closeSheet();cmDistId=d.id;cmView='dist1';render()};
 const dl=s.querySelector('#dDel');if(dl)dl.onclick=()=>confirmSheet(t('del'),X('حذف هذا التوزيع؟','Delete distribution?'),t('yesDel'),()=>{cmDel('dist',d.id);cmView='dist';render()})}
function cmNeed(id,kind){const ex=id?camp.need.find(x=>x.id===id):null,n=ex?clone(ex):{id:uid(),kind:kind||'need',pr:2,st:'open',dir:'in',ts0:Date.now()},ro=!cmCan(),mv=n.kind==='move',P=CM_PR();
 const s=sheet(`<h2>${mv?X('حركة عائلات','Family movement'):(ex?X('مشكلة / احتياج','Issue / need'):X('مشكلة أو احتياج جديد','New issue or need'))}</h2>
  ${mv?`<div class="tkseg cmseg"><button class="${n.dir!=='out'?'on':''}" data-dir="in">${X('وصلت','Arrived')}</button><button class="${n.dir==='out'?'on':''}" data-dir="out">${X('طلعت','Left')}</button></div>${cmF('nN',X('كم عيلة','How many families'),n.n||'1',{num:1})}${cmF('nT',X('ملاحظة (اسم، من وين…)','Note'),n.title)}`
  :`${cmF('nT',X('شو المشكلة أو الاحتياج','What is it'),n.title,{ph:X('خيمة ١٤ انهدت من المطر','Tent 14 collapsed in the rain')})}<div class="fld">${X('الأولوية','Priority')}<div class="tkseg cmseg">${[1,2,3].map(p=>`<button class="${(n.pr||2)===p?'on':''}" data-pr="${p}">${P[p]}</button>`).join('')}</div></div>
   <label class="fld">${X('تفاصيل','Details')}<textarea class="in cmin" id="nD" dir="auto" rows="3">${esc(n.notes||'')}</textarea></label>`}
  ${ro?`<button class="b" id="iClose">${t('close')}</button>`:`${ex&&!mv?`<button class="b ${n.st==='done'?'':'pri'}" id="nSt">${n.st==='done'?X('رجّعها مفتوحة','Reopen'):X('انحلّت','Mark solved')}</button>`:''}<div class="acts"><button class="b" id="iClose">${t('cancel')}</button><button class="b ${ex&&!mv?'':'pri'}" id="nOk">${t('save')}</button></div>${ex?`<button class="b dng" id="nDel">${t('del')}</button>`:''}`}`);
 if(ro)s.querySelectorAll('input,textarea').forEach(e=>e.readOnly=true);s.querySelector('#iClose').onclick=closeSheet;if(ro)return;
 s.querySelectorAll('[data-pr]').forEach(b=>b.onclick=()=>{n.pr=+b.dataset.pr;s.querySelectorAll('[data-pr]').forEach(x=>x.classList.toggle('on',x===b))});
 s.querySelectorAll('[data-dir]').forEach(b=>b.onclick=()=>{n.dir=b.dataset.dir;s.querySelectorAll('[data-dir]').forEach(x=>x.classList.toggle('on',x===b))});
 const sv_=()=>{n.title=cmV(s,'nT');if(mv)n.n=String(cmNum(cmV(s,'nN'))||1);else n.notes=s.querySelector('#nD').value.trim();if(!mv&&!n.title){s.querySelector('#nT').focus();return false}cmPut('need',n);return true};
 s.querySelector('#nOk').onclick=()=>{if(sv_()){closeSheet();render();toast(t('saved'))}};
 const st=s.querySelector('#nSt');if(st)st.onclick=()=>{n.st=n.st==='done'?'open':'done';if(sv_()){closeSheet();render()}};
 const dl=s.querySelector('#nDel');if(dl)dl.onclick=()=>{cmDel('need',n.id);closeSheet();render()}}
function cmInfo(){const s=sheet(`<h2>${X('بيانات المخيم','Camp details')}</h2>${cmF('kN',X('اسم المخيم','Camp name'),camp.info.name)}${cmF('kA',X('المكان','Location'),camp.info.area)}<div class="acts"><button class="b" id="iClose">${t('cancel')}</button><button class="b pri" id="kOk">${t('save')}</button></div>`);
 s.querySelector('#iClose').onclick=closeSheet;s.querySelector('#kOk').onclick=()=>{const n=cmV(s,'kN');if(!n)return;camp.info={name:n,area:cmV(s,'kA'),ts:Date.now()};cmSave();closeSheet();render()}}
function cmAdd(){if(!cmCan())return;if(cmView==='com')cmCom(null);else if(cmView==='org')cmOrg(null);else if(cmView==='dist'||cmView==='dist1')cmDist(null);else if(cmView==='need')cmNeed(null,'need');else cmFam(null)}
function cmMissing(){const d=camp.dist.find(x=>x.id===cmDistId);if(!d)return;const got=new Set(d.got||[]),miss=cmL('fam').filter(x=>!got.has(x.id)).sort((a,b)=>String(a.tent||'').localeCompare(String(b.tent||''),'ar',{numeric:true}));
 shareRaw([d.what+(d.org?' · '+d.org:'')+' · '+tkDate(d.date,lang==='ar'?'ar':'en'),X('لسا ما استلموا ('+miss.length+'):','Not received yet ('+miss.length+'):'),'',...miss.map((x,i)=>(i+1)+'. '+(x.head||x.wife)+(x.tent?X(' · خيمة ',' · tent ')+x.tent:'')+(x.phone?' · '+x.phone:''))].join('\n'))}
function cmPick(){const i=document.createElement('input');i.type='file';i.accept='.xlsx,.xls,.csv,application/vnd.openxmlformats-officedocument.spreadsheetml.sheet,application/vnd.ms-excel';i.onchange=()=>{const f=i.files&&i.files[0];if(f)cmImport(f)};i.click()}
$('#grid').addEventListener('click',e=>{if(tab!==7)return;const g=(a)=>e.target.closest('['+a+']');let b;
 if((b=g('data-cmff'))){cmFF=b.dataset.cmff;b.parentNode.querySelectorAll('.fchip').forEach(c=>c.classList.toggle('on',c===b));const L=document.getElementById('cmflist');if(L)L.innerHTML=cmFamListHTML();return}

 if((b=g('data-cmfam'))){cmFam(b.dataset.cmfam);return}
 if((b=g('data-cmcom'))){cmCom(b.dataset.cmcom);return}
 if((b=g('data-cmrole'))){cmCom(null,b.dataset.cmrole);return}
 if((b=g('data-cmmeet'))){cmMeet(b.dataset.cmmeet);return}
 if(g('data-cmnewmeet')){cmMeet(null);return}
 if((b=g('data-cmorg'))){if(e.target.closest('a'))return;cmOrg(b.dataset.cmorg);return}
 if((b=g('data-cmdist'))){cmDistId=b.dataset.cmdist;cmView='dist1';render();return}
 if((b=g('data-cmgot'))){if(!cmCan())return;const d=camp.dist.find(x=>x.id===cmDistId);if(!d)return;d.got=d.got||[];const i=d.got.indexOf(b.dataset.cmgot);if(i>-1)d.got.splice(i,1);else d.got.push(b.dataset.cmgot);d.ts=Date.now();cmSave();const y=window.scrollY;render();window.scrollTo(0,y);return}
 if(g('data-cmmiss')){cmMissing();return}
 if(g('data-cmdedit')){cmDist(cmDistId);return}
 if((b=g('data-cmneed'))){cmNeed(b.dataset.cmneed);return}
 if(g('data-cmmove')){cmNeed(null,'move');return}
 if(g('data-cmimp')){cmPick();return}
 if(g('data-cmexpf')){cmExport(cmFamFiltered(),cmFLabel());return}
 if(g('data-cmexp')){cmExport();return}
 if(g('data-cmrep')){cmRepShare();return}
 if(g('data-cminfo')){cmInfo();return}
 if(g('data-cmacct')){acctScreen('in');return}
 if(g('data-cmnew')){confirmSheet(X('شارك مع اللجنة','Share with committee'),X('بنعمل نسخة مشتركة من كشف المخيم على حسابك، وبيطلعلك كود تبعته للجنة. أي حدا بدّه ينضم، لازم توافق عليه أنت.','A shared copy is made on your account and you get a code for the committee. You approve everyone who joins.'),X('يلا','Go'),cmCreate);return}
 if(g('data-cmjoin')){cmJoinSheet();return}
 if(g('data-cmcancel')){camp.pend='';camp.pcode='';S.set('camp',camp);render();return}
 if(g('data-cmmem')){cmMembers();return}
 if(g('data-cmsync')){cmSync(true);return}
});
$('#grid').addEventListener('input',e=>{if(tab!==7)return;const b=e.target.closest('[data-cmfq]');if(b){cmFQ=b.value;const L=document.getElementById('cmflist');if(L)L.innerHTML=cmFamListHTML()}});

cmLoad();
/* start */
applyLang();
S.get('probe',0);try{localStorage.setItem('pn_probe','1')}catch(e){storeOK=false}
showLock(S.get('pin','')?'enter':'create');
const imgsReady=idbOpen().then(loadImgs).then(()=>{if(!$('#app').hidden)render()});
if('serviceWorker' in navigator&&hosted){navigator.serviceWorker.register('sw.js').catch(()=>{})}
})();
