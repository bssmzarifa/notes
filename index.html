<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Pocket Notes">
<meta name="theme-color" content="#1F5C58">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="manifest" href="manifest.json">
<style>:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0}[hidden]{display:none!important}</style>
<title>Pocket Notes</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Special+Elite&family=Archivo+Black&family=Caveat:wght@600&family=Cairo:wght@500;700;800&display=swap" rel="stylesheet">
<style>
/* Layout: green cutting mat as the ground, a cork board panel on top, paper index cards taped to the cork. One committed look, same in light and dark. */
:root{
  color-scheme:dark;
  --mat:#1F5C58; --mat-line:rgba(93,202,165,.22); --ink:#1b1b1a; --paper:#FBFAF6; --tab:#EDE8DC;
  --cork:#C69C6D; --cork-dot:rgba(138,95,52,.4); --cork-dot2:rgba(232,201,154,.4);
  --yellow:#F2E14C; --red:#E24B4A; --green:#3B6D11; --muted:#7c7a73; --cream:#F6F1E4; --rule:rgba(55,138,221,.35);
  --f-display:'Archivo Black','Arial Black',Impact,sans-serif;
  --f-type:'Special Elite','Courier New',Courier,monospace;
  --f-hand:'Caveat','Segoe Print','Bradley Hand',cursive;
  --f-ar:'Cairo','Geeza Pro','Noto Sans Arabic',Tahoma,sans-serif;
}
html,body{height:100%}
body{background-color:var(--mat);background-image:linear-gradient(var(--mat-line) 1px,transparent 1px),linear-gradient(90deg,var(--mat-line) 1px,transparent 1px);background-size:24px 24px;color:var(--ink);font-family:var(--f-type);-webkit-tap-highlight-color:transparent;overscroll-behavior:none}
body.ar{font-family:var(--f-ar)}
*{box-sizing:border-box}
button,input,textarea,select{font:inherit;color:inherit}
button{cursor:pointer;border:0;background:none}
:focus-visible{outline:3px solid var(--yellow);outline-offset:2px}
.wrap{max-width:560px;margin:0 auto;padding-left:max(14px,env(safe-area-inset-left,0px));padding-right:max(14px,env(safe-area-inset-right,0px))}
.star{flex:none}
/* lock */
#lock{min-height:100%;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:0;padding-block:24px}
.lcard{background:var(--paper);padding:16px 22px 14px;transform:rotate(-1.5deg);text-align:center;position:relative;min-width:210px;margin-top:12px}
.tape:before{content:"";position:absolute;top:-7px;left:50%;width:44px;height:14px;margin-left:-22px;background:rgba(241,239,232,.8);border:.5px solid #D3D1C7;transform:rotate(3deg)}
.lt1{font-family:var(--f-display);font-size:20px}
body.ar .lt1{font-family:var(--f-ar);font-weight:800}
.lt2{font-size:11px;color:var(--muted);letter-spacing:1.5px;margin-top:4px;min-height:15px}
.lt2.err{color:var(--red)}.lt2.ok{color:var(--green)}
.dots{display:flex;gap:18px;margin:26px 0 30px;direction:ltr}
.d{width:17px;height:17px;border-radius:50%;border:2px solid var(--cream);transition:all .15s}
.d.f{background:var(--yellow);border-color:var(--yellow);transform:scale(1.15)}
.dots.err .d{border-color:#F09595}.dots.err .d.f{background:var(--red);border-color:var(--red)}
.dots.ok .d{background:#97C459;border-color:#97C459}
@keyframes sh{0%,100%{transform:translateX(0)}20%,60%{transform:translateX(-10px)}40%,80%{transform:translateX(10px)}}
.shake{animation:sh .4s}
.pad{display:grid;grid-template-columns:repeat(3,74px);gap:14px 22px;direction:ltr}
.k{height:62px;background:var(--tab);font-family:var(--f-display);font-size:24px;display:flex;align-items:center;justify-content:center;border-radius:4px;transition:transform .08s,background .08s;touch-action:manipulation;user-select:none;-webkit-user-select:none}
.k:active,.k.pr{background:var(--yellow);transform:scale(.92)}
.k.ghost{background:transparent;color:var(--cream);font-size:22px}
.lfoot{display:flex;gap:18px;margin-top:26px}
.link{color:var(--cream);font-size:13px;text-decoration:underline;text-underline-offset:3px;padding:6px}
/* app */
#app{padding-bottom:calc(110px + env(safe-area-inset-bottom,0px))}
.hd{display:flex;align-items:center;gap:10px;padding-block:14px 8px}
.ttl{color:var(--cream);line-height:1;flex:1;min-width:0}
.ttl b{font-family:var(--f-display);font-size:24px;letter-spacing:1px;display:block;font-weight:400}
body.ar .ttl b{font-family:var(--f-ar);font-weight:800;letter-spacing:0}
.ttl span{font-size:10px;letter-spacing:2px}
.hbtn{background:var(--tab);color:var(--ink);height:38px;min-width:38px;padding:0 10px;border-radius:4px;font-size:13px;display:flex;align-items:center;justify-content:center;gap:6px}
.sr{display:flex;align-items:center;gap:8px;background:var(--paper);border-radius:3px;padding:0 10px;margin-bottom:10px}
.sr input{flex:1;min-width:0;border:0;background:transparent;height:42px;font-size:16px;outline:none}
.sr input::placeholder{color:var(--muted)}
.sr:focus-within{outline:3px solid var(--yellow)}
.tabs{display:flex;gap:5px;position:sticky;top:env(safe-area-inset-top,0px);z-index:5;padding-top:6px;background:var(--mat)}
.tab{flex:1;background:var(--tab);font-size:12px;padding:9px 6px 8px;display:flex;justify-content:space-between;align-items:baseline;gap:4px;border-radius:3px 3px 0 0;min-width:0}
.tab i{font-style:normal;font-size:10px;color:var(--muted);font-variant-numeric:tabular-nums}
.tab.on{background:var(--yellow)}
body.ar .tab{font-size:13px}
.cork{background-color:var(--cork);background-image:radial-gradient(var(--cork-dot) 1px,transparent 1.5px),radial-gradient(var(--cork-dot2) 1px,transparent 1.5px);background-size:7px 7px,11px 11px;background-position:0 0,3px 4px;border-radius:0 0 4px 4px;padding:14px 10px 18px;min-height:60vh}
.info{display:inline-block;background:var(--ink);color:var(--yellow);font-size:11px;letter-spacing:1px;padding:4px 9px;margin-bottom:12px}
.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px 11px;align-items:start}
.cd{background:var(--paper);padding:13px 10px 10px;position:relative;text-align:start;width:100%;min-height:86px;display:flex;flex-direction:column;gap:5px;transition:transform .2s}
.cd:active{transform:scale(.97)!important}
.cd.wide{grid-column:1/-1}
.cd.imp{box-shadow:inset 0 3px 0 var(--red)}
.lb{font-size:9px;color:var(--muted);letter-spacing:1px;display:flex;justify-content:space-between;gap:6px}
.lb u{text-decoration:none;color:var(--ink);font-size:9px;border:.5px solid #B4B2A9;padding:0 4px;white-space:nowrap}
.lb u.ex{background:var(--yellow);border-color:var(--yellow)}
.big{font-family:var(--f-display);font-size:16px;line-height:1.2;overflow-wrap:anywhere}
.hand{font-family:var(--f-hand);font-size:22px;line-height:1.1;overflow-wrap:anywhere;white-space:pre-wrap}
body.ar .big,body.ar .hand{font-family:var(--f-ar);font-weight:700;font-size:16px;line-height:1.5}
.idx{background-image:linear-gradient(transparent 21px,var(--rule) 21px);background-size:100% 22px;border-top:3px solid var(--red);padding-top:10px}
.row{display:flex;justify-content:space-between;gap:10px;font-family:var(--f-hand);font-size:21px;line-height:22px;font-variant-numeric:tabular-nums}
body.ar .row{font-family:var(--f-ar);font-size:15px;font-weight:500}
.tot{display:flex;justify-content:space-between;align-items:center;font-family:var(--f-display);font-size:15px;border-top:1.5px dashed var(--ink);padding-top:6px;margin-top:4px}
body.ar .tot{font-family:var(--f-ar);font-weight:800}
.tot span:last-child{background:var(--yellow);padding:1px 7px;font-variant-numeric:tabular-nums}
.num{font-family:var(--f-hand);font-size:22px;direction:ltr;unicode-bidi:isolate;user-select:all;-webkit-user-select:all}
.pact{display:flex;gap:6px;margin-top:4px}
.mini{font-size:11px;border:.5px solid #B4B2A9;padding:5px 8px;border-radius:3px;background:var(--tab);color:var(--ink);text-decoration:none;display:inline-flex;align-items:center}
mark{background:var(--yellow);color:inherit;padding:0 1px}
.empty{grid-column:1/-1;background:var(--paper);padding:22px 16px;text-align:center;transform:rotate(-1deg)}
.empty b{font-family:var(--f-display);font-size:18px;display:block;margin-bottom:6px;font-weight:400}
body.ar .empty b{font-family:var(--f-ar);font-weight:800}
.fab{position:fixed;right:calc(18px + env(safe-area-inset-right,0px));bottom:calc(20px + env(safe-area-inset-bottom,0px));width:64px;height:64px;border-radius:50%;background:var(--yellow);color:var(--ink);font-family:var(--f-display);font-size:34px;line-height:1;display:flex;align-items:center;justify-content:center;border:3px solid var(--ink);z-index:20}
body.ar .fab{right:auto;left:calc(18px + env(safe-area-inset-left,0px))}
/* sheets */
.ov{position:fixed;inset:0;background:rgba(10,20,18,.6);z-index:40;display:flex;align-items:flex-end;justify-content:center}
.sheet{background:var(--paper);width:100%;max-width:560px;max-height:92%;overflow-y:auto;border-radius:12px 12px 0 0;padding:18px max(16px,env(safe-area-inset-right,0px)) calc(18px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px));border-top:4px solid var(--red);display:flex;flex-direction:column;gap:12px}
.sheet h2{font-family:var(--f-display);font-size:20px;margin:0;font-weight:400}
body.ar .sheet h2{font-family:var(--f-ar);font-weight:800}
.seg{display:flex;gap:6px}
.seg button{flex:1;background:var(--tab);padding:10px 4px;border-radius:4px;font-size:13px}
.seg button.on{background:var(--yellow)}
.fld{display:flex;flex-direction:column;gap:5px;font-size:12px;color:var(--muted);letter-spacing:.5px}
.in{background:#fff;border:1.5px solid #D3D1C7;border-radius:4px;padding:10px;font-size:16px;color:var(--ink);width:100%;min-width:0}
.in:focus{outline:none;border-color:var(--ink)}
textarea.in{min-height:110px;resize:vertical;font-family:var(--f-hand);font-size:22px;line-height:1.2}
body.ar textarea.in{font-family:var(--f-ar);font-size:16px;line-height:1.6}
.chk{display:flex;align-items:center;gap:8px;font-size:14px;color:var(--ink)}
.chk input{width:20px;height:20px;accent-color:var(--red)}
.mrow{display:grid;grid-template-columns:minmax(0,1fr) 96px 36px;gap:6px}
.x{background:var(--tab);border-radius:4px;font-size:16px}
.live{display:flex;justify-content:space-between;font-family:var(--f-display);font-size:16px;padding:8px 10px;background:var(--yellow)}
body.ar .live{font-family:var(--f-ar);font-weight:800}
.acts{display:flex;gap:8px;flex-wrap:wrap}
.b{background:var(--tab);padding:12px 16px;border-radius:4px;font-size:14px;flex:1}
.b.pri{background:var(--ink);color:var(--yellow)}
.b.dng{background:transparent;color:var(--red);border:1.5px solid var(--red)}
.err{color:var(--red);font-size:13px;min-height:0}
.mi{display:flex;align-items:center;gap:10px;background:var(--tab);padding:13px 14px;border-radius:4px;font-size:15px;text-align:start;width:100%}
.mi.dng{color:var(--red)}
.hint{font-size:13px;color:var(--muted);line-height:1.5;margin:0}
.toast{position:fixed;left:50%;bottom:calc(100px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--yellow);padding:9px 16px;font-size:13px;letter-spacing:1px;z-index:50;border-radius:3px;white-space:nowrap}
.warn{background:var(--red);color:#fff;font-size:12px;padding:8px 10px;margin-bottom:10px;border-radius:3px}
.writer{position:fixed;left:0;right:0;top:0;height:100%;z-index:35;background:var(--paper);border-top:4px solid var(--red);display:flex;flex-direction:column;transform-origin:12% 95%;transform:scale(.06);opacity:0;transition:transform .34s cubic-bezier(.2,.8,.2,1),opacity .25s;padding-top:env(safe-area-inset-top,0px)}
body.ar .writer{transform-origin:12% 95%}
.writer.open{transform:none;opacity:1}
.wbar{display:flex;align-items:center;gap:10px;padding:10px max(14px,env(safe-area-inset-right,0px)) 6px max(14px,env(safe-area-inset-left,0px))}
.wback{color:#854F0B;font-size:16px;padding:8px 4px;font-weight:700}
.wicon{width:42px;height:42px;border-radius:50%;background:var(--tab);color:var(--red);display:flex;align-items:center;justify-content:center}
.wok{width:46px;height:46px;border-radius:50%;background:var(--yellow);color:var(--ink);display:flex;align-items:center;justify-content:center;border:2px solid var(--ink)}
.wpage{flex:1;overflow-y:auto;padding:8px max(18px,env(safe-area-inset-right,0px)) 18px max(18px,env(safe-area-inset-left,0px));font-family:var(--f-type);font-size:18px;line-height:1.6;outline:none;white-space:pre-wrap;overflow-wrap:anywhere;-webkit-user-select:text;user-select:text;position:relative}
body.ar .wpage{font-family:var(--f-ar);font-size:18px;line-height:1.8}
.wpage::first-line{font-family:var(--f-display);font-size:24px}
body.ar .wpage::first-line{font-family:var(--f-ar);font-weight:800;font-size:24px}
.wpage.empty:before{content:attr(data-ph);color:#a9a69c;position:absolute;pointer-events:none;white-space:pre-wrap;font-size:16px;line-height:1.6}
.wlive{display:flex;justify-content:space-between;gap:10px;background:var(--yellow);color:#412402;font-family:var(--f-display);font-size:15px;padding:9px max(16px,env(safe-area-inset-right,0px)) calc(9px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px))}
body.ar .wlive{font-family:var(--f-ar);font-weight:800}
.big.mt{font-size:20px;margin:2px 0 6px}
body.ar .big.mt{font-size:21px;font-weight:800}
.num{font-family:var(--f-display)!important;font-size:18px!important;letter-spacing:.5px}
.mini.call{background:#3B6D11;border-color:#3B6D11;color:#fff;gap:5px;font-weight:700}
.ttl b{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.studio{position:fixed;inset:0;z-index:36;background:#1b1b1a;color:var(--cream);overflow-y:auto;-webkit-overflow-scrolling:touch;padding:env(safe-area-inset-top,0px) max(16px,env(safe-area-inset-right,0px)) calc(24px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px));display:flex;flex-direction:column;gap:14px;opacity:0;transform:translateY(24px);transition:opacity .25s,transform .3s}
.studio.open{opacity:1;transform:none}
.studio>*{flex:none}
.sbar{display:flex;align-items:center;gap:10px;padding-top:12px}
.sbar h2{flex:1;margin:0;font-family:var(--f-display);font-size:20px;font-weight:400}
body.ar .sbar h2{font-family:var(--f-ar);font-weight:800}
.sbar .wback{color:var(--yellow)}
.wframe{width:min(62vw,240px);aspect-ratio:1125/2436;max-width:100%;margin:0 auto;border:6px solid #444441;border-radius:28px;overflow:hidden;position:relative;background:#000}
.wframe canvas{width:100%;height:100%;display:block}
.wclock{position:absolute;left:0;right:0;top:9%;text-align:center;color:#fff;font-family:-apple-system,'Helvetica Neue',Arial,sans-serif;direction:ltr;pointer-events:none;text-shadow:0 1px 4px rgba(0,0,0,.35)}
.wclock small{display:block;font-size:11px;font-weight:600}
.wclock b{display:block;font-size:46px;font-weight:600;line-height:1}
.slab{font-size:11px;letter-spacing:1.5px;color:#B4B2A9;display:flex;justify-content:space-between}
body.ar .slab{letter-spacing:0;font-size:13px}
.chips{display:flex;flex-wrap:wrap;gap:7px}
.chip{background:#2C2C2A;color:var(--cream);border:1.5px solid #444441;border-radius:20px;padding:7px 12px;font-size:13px;max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;display:flex;align-items:center;gap:6px}
.chip.on{background:var(--yellow);color:var(--ink);border-color:var(--yellow)}
.chip i{font-style:normal;font-weight:700}
.sws{display:flex;gap:10px}
.sw{flex:1;height:52px;border-radius:8px;border:3px solid transparent;font-size:11px;color:#fff;display:flex;align-items:flex-end;justify-content:center;padding-bottom:3px;text-shadow:0 1px 2px rgba(0,0,0,.6)}
.sw.on{border-color:var(--yellow)}
.stks{display:flex;gap:8px;flex-wrap:wrap}
.stk{width:46px;height:46px;border-radius:10px;background:#2C2C2A;font-size:24px;display:flex;align-items:center;justify-content:center;font-family:'Apple Color Emoji','Segoe UI Emoji','Noto Color Emoji',sans-serif}
.stk:active{transform:scale(.88)}
.stk.txt{width:auto;padding:0 12px;font-size:13px;font-family:inherit;color:var(--cream)}
.wsave{background:var(--yellow);color:var(--ink);font-family:var(--f-display);font-size:17px;padding:15px;border-radius:8px;border:2px solid var(--ink)}
body.ar .wsave{font-family:var(--f-ar);font-weight:800}
.whow{font-size:13px;line-height:1.6;color:#D3D1C7;background:#2C2C2A;border-radius:8px;padding:10px 12px;margin:0}
.whow b{color:var(--yellow);font-weight:700}
.wnote{font-size:12px;color:#F09595;min-height:0;margin:0}
.wimg{max-height:58vh;max-width:100%;margin:0 auto;display:block;border-radius:12px;border:1px solid #D3D1C7;-webkit-touch-callout:default}
.hand.sm{font-size:19px;color:#444441}
body.ar .hand.sm{font-size:14px;font-weight:500}
@keyframes pop{0%{outline:3px solid var(--yellow);transform:scale(1.08)}100%{outline:3px solid transparent}}
.cd.fresh{animation:pop 1.2s ease-out}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>

</head>
<body>
<div id="lock" hidden>
  <svg class="star" width="72" height="72" viewBox="0 0 48 48" aria-hidden="true"><polygon fill="#F2E14C" points="24,1 28,9 36,4 36,13 45,13 40,21 47,26 39,30 43,38 34,38 33,47 26,41 20,47 17,39 8,42 10,33 2,29 9,24 3,17 12,15 11,6 19,9"/><rect x="17" y="22" width="14" height="11" rx="2" fill="#412402"/><path d="M19.5 22v-3a4.5 4.5 0 0 1 9 0v3" fill="none" stroke="#412402" stroke-width="2.2"/></svg>
  <div class="lcard tape"><div class="lt1" id="lt1"></div><div class="lt2" id="lt2"></div></div>
  <div class="dots" id="dots" aria-hidden="true"><div class="d"></div><div class="d"></div><div class="d"></div><div class="d"></div></div>
  <div class="pad" id="pad"></div>
  <div class="lfoot"><button class="link" id="forgotBtn"></button><button class="link" id="lockLang"></button><button class="link" id="cancelPin" hidden></button></div>
</div>

<div id="app" hidden>
  <div class="wrap">
    <div class="hd">
      <svg class="star" width="52" height="52" viewBox="0 0 48 48" aria-hidden="true"><polygon fill="#F2E14C" points="24,1 28,9 36,4 36,13 45,13 40,21 47,26 39,30 43,38 34,38 33,47 26,41 20,47 17,39 8,42 10,33 2,29 9,24 3,17 12,15 11,6 19,9"/><text x="24" y="22" text-anchor="middle" font-size="7" fill="#412402" font-family="Special Elite,Courier New,monospace">MY</text><text x="24" y="31" text-anchor="middle" font-size="7.6" fill="#412402" font-family="Archivo Black,Arial Black,sans-serif">POCKET</text></svg>
      <div class="ttl"><b id="appName"></b><span id="tagline"></span></div>
      <button class="hbtn" id="wallBtn" aria-label="Wallpaper"><svg width="18" height="18" viewBox="0 0 24 24" aria-hidden="true"><rect x="6" y="2" width="12" height="20" rx="3" fill="none" stroke="currentColor" stroke-width="2"/><rect x="8.5" y="9" width="7" height="6" fill="currentColor"/></svg></button><button class="hbtn" id="langBtn"></button>
      <button class="hbtn" id="menuBtn" aria-label="Menu"><svg width="18" height="18" viewBox="0 0 24 24" aria-hidden="true"><path d="M4 7h16M4 12h16M4 17h16" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"/></svg></button>
    </div>
    <div id="storeWarn" class="warn" hidden></div>
    <label class="sr"><svg width="18" height="18" viewBox="0 0 24 24" aria-hidden="true"><circle cx="10.5" cy="10.5" r="6.5" fill="none" stroke="#7c7a73" stroke-width="2.2"/><path d="M15.5 15.5 21 21" stroke="#7c7a73" stroke-width="2.2" stroke-linecap="round"/></svg><input id="q" type="search" autocomplete="off" enterkeyhint="search"><button id="qx" class="mini" hidden>✕</button></label>
    <div class="tabs" id="tabs" role="tablist"></div>
    <div class="cork"><div id="info"></div><div class="grid" id="grid"></div></div>
  </div>
  <button class="fab" id="fab" aria-label="Add">+</button>
</div>

<div id="ov" class="ov" hidden></div>

async function hash(p){const salt=S.get('salt','');const s=salt+':'+p;try{const b=await crypto.subtle.digest('SHA-256',new TextEncoder().encode(s));return [...new Uint8Array(b)].map(x=>x.toString(16).padStart(2,'0')).join('')}catch(e){let h=5381;for(const c of s)h=((h<<5)+h+c.charCodeAt(0))|0;return 'f'+h}}
let mode='enter',pin='',first='',busy=false,fails=S.get('fails',0),until=S.get('until',0);

function bad(msg){busy=true;const d=$('#dots');d.className='dots err shake';sub(msg,'err');setTimeout(()=>{d.className='dots';pin='';paint();busy=false},650)}

 if(mode==='create'){first=pin;mode='confirm';pin='';paint();lockText();return}
 if(mode==='confirm'){if(pin!==first){mode='create';bad(t('mismatch'));setTimeout(lockText,700);return}
  if(!S.get('salt',''))S.set('salt',Math.random().toString(36).slice(2)+Date.now());
  S.set('pin',await hash(pin));const wasChanging=changing;changing=false;if(items===null){items=examples();save()}openApp(wasChanging?t('pinChanged'):'');return}
 const now=Date.now();if(until>now){bad(t('wait',{s:Math.ceil((until-now)/1000)}));return}
 const ok=(await hash(pin))===S.get('pin','');
 if(ok){fails=0;S.set('fails',0);if(mode==='verify'){mode='create';pin='';paint();lockText();return}

 else{fails++;S.set('fails',fails);if(fails>=5){until=Date.now()+30000;S.set('until',until);fails=0;S.set('fails',0)}bad(until>Date.now()?t('wait',{s:30}):t('wrong'))}
}

/* ---------- data ---------- */
const uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,7);
function examples(){const n=Date.now();return[
 {id:uid(),type:'note',text:lang==='ar'?'اشتري خبز ورز':'Buy bread and rice',imp:false,ts:n,ex:true},

 {id:uid(),type:'note',text:lang==='ar'?'اضغط على أي بطاقة لتعديلها\nاضغط + لكتابة جديدة':'Tap any card to edit it\nTap + to write a new one',imp:true,ts:n-3,ex:true}]}

const toNum=a=>{const s=String(a||'').replace(/[٠-٩]/g,d=>'٠١٢٣٤٥٦٧٨٩'.indexOf(d)).replace(/[٫,]/g,'.').replace(/[^0-9.\-]/g,'');const v=parseFloat(s);return isFinite(v)?v:0};
const fmt=v=>(Math.round(v*100)/100).toLocaleString('en-US',{maximumFractionDigits:2});
const sum=it=>(it.rows||[]).reduce((s,r)=>s+toNum(r.a),0);
const norm=s=>String(s||'').toLowerCase().replace(/[أإآٱ]/g,'ا').replace(/ة/g,'ه').replace(/ى/g,'ي').replace(/[ً-ْ]/g,'');
const textOf=it=>it.type==='note'?it.text:it.type==='money'?[it.title,...(it.rows||[]).map(r=>r.n+' '+r.a)].join(' '):it.name+' '+it.num+' '+String(it.num||'').replace(/\s/g,'');
const typeOfTab=['','note','money','phone'];

function hl(s){s=String(s==null?'':s);if(!query)return esc(s);const q=query.trim();if(!q)return esc(s);
 const ns=norm(s),nq=norm(q);let out='',i=0,p;
 if(ns.length!==s.length)return esc(s);
 while((p=ns.indexOf(nq,i))>-1){out+=esc(s.slice(i,p))+'<mark>'+esc(s.slice(p,p+nq.length))+'</mark>';i=p+nq.length}
 return out+esc(s.slice(i))}
function rot(id){let h=0;for(const c of id)h=(h*31+c.charCodeAt(0))|0;return ((Math.abs(h)%31)/10-1.5).toFixed(1)}
function dlabel(ts){try{return new Date(ts).toLocaleDateString(lang==='ar'?'ar':'en-GB',{day:'numeric',month:'short'})}catch(e){return ''}}

function card(it){
 const tag=it.ex?`<u class="ex">${t('ex')}</u>`:`<u>${esc(dlabel(it.ts))}</u>`;
 const r=`style="transform:rotate(${rot(it.id)}deg)"`;
 if(it.type==='note'){const ls=String(it.text||'').split('\n');const head=ls[0],rest=ls.slice(1).join('\n');const long=!rest&&head.length>34;
  return `<button class="cd tape ${it.imp?'imp':''}" data-id="${it.id}" ${r}><div class="lb">${t('lblNote')}${tag}</div><div class="${long?'hand':'big'}">${hl(head)}</div>${rest?`<div class="hand sm">${hl(rest)}</div>`:''}</button>`}
 if(it.type==='money'){const rows=(it.rows||[]).map(x=>`<div class="row"><span>${hl(x.n)}</span><span>${x.a?hl(x.a)+' '+esc(cur):''}</span></div>`).join('');
  return `<button class="cd tape idx wide" data-id="${it.id}" ${r}><div class="lb">${t('lblMoney')}${tag}</div><div class="big mt">${hl(it.title)}</div>${rows}<div class="tot"><span>${t('total')}</span><span>${fmt(sum(it))} ${esc(cur)}</span></div></button>`}
 const tel=telOf(it.num);
 return `<div class="cd tape" data-id="${it.id}" role="button" tabindex="0" ${r}><div class="lb">${t('lblPhone')}${tag}</div><div class="big">${hl(it.name)}</div><div class="num">${hl(it.num)}</div><div class="pact"><button class="mini" data-copy="${esc(tel)}">${t('copy')}</button><a class="mini call" href="tel:${esc(tel)}"><svg width="13" height="13" viewBox="0 0 24 24" aria-hidden="true"><path d="M5 3h4l2 5-3 2a12 12 0 0 0 6 6l2-3 5 2v4a2 2 0 0 1-2 2A17 17 0 0 1 3 5a2 2 0 0 1 2-2z" fill="currentColor"/></svg>${t('call')}</a></div></div>`}

function render(){
 const list=(items||[]).slice().sort((a,b)=>b.ts-a.ts);
 const counts=[list.length,...['note','money','phone'].map(ty=>list.filter(i=>i.type===ty).length)];
 $('#tabs').innerHTML=t('tabs').map((n,i)=>`<button class="tab ${i===tab?'on':''}" role="tab" aria-selected="${i===tab}" data-t="${i}">${n}<i>${counts[i]}</i></button>`).join('');
 let show=tab?list.filter(i=>i.type===typeOfTab[tab]):list;
 const q=norm(query.trim());
 if(q)show=show.filter(i=>norm(textOf(i)).includes(q));
 $('#info').innerHTML=q?(show.length?`<span class="info">${t('found',{n:show.length})}</span>`:''):'';
 $('#grid').innerHTML=show.length?show.map(card).join(''):(q?`<div class="empty"><b>${esc(t('none',{q:query.trim()}))}</b></div>`:`<div class="empty tape"><b>${t('emptyT')}</b>${t('emptyB')}</div>`);
 $('#qx').hidden=!query;
 $('#storeWarn').hidden=storeOK;
}
$('#tabs').onclick=e=>{const b=e.target.closest('.tab');if(b){tab=+b.dataset.t;render()}};

 const c=e.target.closest('[data-copy]');if(c){e.stopPropagation();const v=c.dataset.copy;try{await navigator.clipboard.writeText(v);toast(t('copied'))}catch(err){const n=c.closest('.cd').querySelector('.num');const rg=document.createRange();rg.selectNodeContents(n);const s=getSelection();s.removeAllRanges();s.addRange(rg)}return}
 if(e.target.closest('a'))return;
 const cd=e.target.closest('.cd[data-id]');if(cd)editor(items.find(i=>i.id===cd.dataset.id))});
$('#grid').addEventListener('keydown',e=>{if(e.key==='Enter'&&e.target.matches('div.cd[data-id]'))editor(items.find(i=>i.id===e.target.dataset.id))});

function fixOld(){if(!migrate||!items)return;migrate=false;let ch=false;items=items.map(it=>{if(it.type==='phone'){const n=prettyNum(it.num);const nm=String(it.name||'').replace(/[.:،,\-–]+$/,'').trim();if(n!==it.num||nm!==it.name){ch=true;return{...it,num:n,name:nm||n}}}if(it.type==='note'&&!it.ex){const c=classify(it.src||it.text);if(c&&c.type!=='note'){ch=true;return{id:it.id,ts:it.ts,imp:it.imp,src:it.src||it.text,...c}}}return it});if(ch)save()}

/* ---------- full-page writer (like iPhone Notes) ---------- */
const AD='٠١٢٣٤٥٦٧٨٩';const latin=s=>String(s).replace(/[٠-٩]/g,d=>AD.indexOf(d));
function srcOf(it){if(!it)return '';if(it.src)return it.src;if(it.type==='note')return it.text||'';if(it.type==='money')return [it.title,...(it.rows||[]).map(r=>(r.n+' '+r.a).trim())].join('\n');return (it.name||'')+'\n'+(it.num||'')}
const VEX=['وقود','ورق','وجب','ورد','وساد','وزن','وصل','وصف','ولاع','وسخ','وعاء','واي'];
const CURR='₪|شيكل|شيقل|شواكل|\\$|دولار|€|يورو|jod|دينار|try|tl|ليرة|ليره|egp|جنيه|nis|ils';
const MONEYW=/مصاريف|مصروف|مصروفات|حساب|فاتور|اغراض|أغراض|مشتريات|expens|spent|shopping|bill|cost/i;
function cleanItem(n){n=String(n).replace(/[،,:=\-–+.؛;]+/g,' ').replace(/\s+/g,' ').trim();n=n.replace(/^و\s+/,'');if(/^و[ء-ي]{2,}/.test(n)&&!VEX.some(w=>n.startsWith(w)))n=n.slice(1);return n.trim()}
function pairsOf(line){const re=new RegExp('([^\\d]*?)\\s*(\\d+(?:[.,]\\d+)?)\\s*('+CURR+')?(?=[\\s،,.؛;]|$)','gi');const out=[];let m,last=0,cur=false;

 s.querySelector('#rCancel').onclick=closeSheet;

 s.querySelector('#rGo').onclick=()=>{const o=parseBackup(s.querySelector('#rTxt').value);if(!o){s.querySelector('#rErr').textContent=t('badBackup');return}items=o.items.filter(i=>i&&i.id&&i.type);if(o.cur){cur=o.cur;S.set('cur',cur)}save();closeSheet();render();toast(t('restored',{n:items.length}))}}
function eraseAll(){['items','pin','salt','fails','until','cur'].forEach(S.del);items=null;cur='₪';fails=0;until=0;changing=false;query='';$('#q').value='';tab=0;showLock('create')}

/* auto-lock after 60s away */
let hiddenAt=0;
document.addEventListener('visibilitychange',()=>{if(document.hidden)hiddenAt=Date.now();else if(hiddenAt&&Date.now()-hiddenAt>60000&&S.get('pin','')&&!$('#app').hidden)showLock('enter')});

/* start */
applyLang();
S.get('probe',0);try{localStorage.setItem('pn_probe','1')}catch(e){storeOK=false}
showLock(S.get('pin','')?'enter':'create');
if('serviceWorker' in navigator&&hosted){navigator.serviceWorker.register('sw.js').catch(()=>{})}
})();
</script>
